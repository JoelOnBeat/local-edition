[project]
name = "local-edition-guardrails"
version = "0.2.0"
description = "NeMo Guardrails batch rails for Local Edition: certifies copy in the Nebius Serverless Job (no server)."
requires-python = ">=3.11,<3.13"
dependencies = [
  "nemoguardrails==0.24.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
