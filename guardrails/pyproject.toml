[project]
name = "local-edition-guardrails"
version = "0.1.0"
description = "NeMo Guardrails sidecar for Local Edition: blocks health, diet, nutrition and allergen claims and checks brand voice."
requires-python = ">=3.11,<3.13"
dependencies = [
  "nemoguardrails[server]==0.24.1",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
