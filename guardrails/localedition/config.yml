# Local Edition copy rails for the batch job (NeMo Guardrails 0.24.1, library mode: no server).
# Used by guardrails/localedition/batch.py inside the Nebius Serverless Job (jobs/certify.py).
#
# The only model is Lightning on Token Factory, reasoning OFF: top-level reasoning_effort and
# chat_template_kwargs (measured: 0 reasoning tokens). NeMo's own client sends `parameters` as default
# request fields; NEBIUS_API_KEY comes from the environment. Never nvidia/nemotron-3-super-120b-a12b
# (leaves Token Factory Serverless on 9 Nov 2026). `self check output` has no model entry of its own, so
# it uses this `main` model.
models:
  - type: main
    engine: openai
    model: nvidia/Nemotron-3_5-Lightning
    api_key_env_var: NEBIUS_API_KEY
    parameters:
      base_url: https://api.tokenfactory.nebius.com/v1/
      reasoning_effort: none
      chat_template_kwargs:
        enable_thinking: false

rails:
  output:
    flows:
      - check health claims   # OUR regex catalogue, run by NeMo's runtime as a custom action; runs first
      - self check output     # NeMo's built-in LLM rail; prompt text in prompts.yml; brand voice rides in the user turn
