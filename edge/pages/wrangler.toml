# Cloudflare Pages project "localedition" (https://localedition.pages.dev): a thin front for the product Worker, which
# deploys with workers_dev = false. Deploy with: npx wrangler pages deploy public --project-name localedition
name = "localedition"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[services]]
binding = "APP"
service = "local-edition"
