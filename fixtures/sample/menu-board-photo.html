<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Kettle &amp; Kiln sample menu board, phone photo</title>
<style>
  /* The same board as if photographed on a phone: slight perspective, rotation, softness and a vignette.
     Rendered to public/sample/menu-board-photo.png at 1200x1600. Only CSS transforms and filters. */
  html, body { margin: 0; padding: 0; width: 1200px; height: 1600px; overflow: hidden; }
  .scene {
    position: relative; width: 1200px; height: 1600px; overflow: hidden;
    background:
      linear-gradient(160deg, rgba(255,246,230,0.18), rgba(0,0,0,0) 45%),
      repeating-linear-gradient(88deg, rgba(90,60,35,0.10) 0 3px, rgba(0,0,0,0) 3px 19px),
      linear-gradient(180deg, #c9b8a2 0%, #a48f77 55%, #7d6a57 100%);
  }
  .board {
    position: absolute; left: 50%; top: 50%; width: 1600px; height: 1100px; border: 0;
    transform-origin: 50% 50%;
    transform: translate(-50%, -50%) perspective(1700px) rotateX(9deg) rotateY(-4deg) rotateZ(-3.2deg) scale(0.7);
    filter: blur(0.75px) brightness(0.96) contrast(0.94) saturate(0.9);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 62% 56% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.42) 100%);
  }
  .glare {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.12;
    background: linear-gradient(118deg, rgba(255,255,255,0) 28%, rgba(255,255,255,0.9) 42%, rgba(255,255,255,0) 58%);
    mix-blend-mode: screen;
  }
  .grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: overlay;
    background-image: radial-gradient(rgba(0,0,0,0.9) 0.6px, transparent 0.7px);
    background-size: 3px 3px;
  }
</style>
</head>
<body>
<div class="scene">
  <iframe class="board" src="menu-board.html" title="Kettle and Kiln sample menu board"></iframe>
  <div class="glare"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>
</body>
</html>
